; The menu choices the installer sets in longshot_options.ini. It keeps a copy of the file first and leaves every other
; line (your controls among them) as it was. The same rows are in the game's menu (Insert, or the controller's menu).
; Graphics: Quality preset "Minimum (4GB)", Render resolution's 4th stop (the 3D at 1024x576), Window scaling filter
; Lanczos, Output resolution 2048x1152.
quality_preset=1
resolution=3
upscaling=2
output_res=2048x1152
; Frame generation 2x, by the renderer's own maker (RX_VK_FSR_FG in longshot_env.txt), with Frame pacing on.
frame_generation=2
frame_pacing=1
; The frame cap comes from HOS_FPS_MAX in longshot_env.txt, so the menu's Frame rate cap stays off.
frame_rate_cap=0
; The handheld profile (the Profile row), fullscreen, and the rest as measured: sharpness 50, anisotropic filtering 16x,
; game speed normal.
handheld_profile=1
fullscreen=1
sharpness=50
anisotropic_filtering=4
game_speed=1
